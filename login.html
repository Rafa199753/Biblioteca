<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Biblioteca Infantil</title>
    <style>
        :root {
            --cor-primaria: #6d5ef6;
            --cor-primaria-escura: #4d3fd9;
            --cor-secundaria: #ffb454;
            --cor-texto: #2b2a3d;
            --cor-verde: #22b181;
            --cor-erro: #c03952;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--cor-texto);
            background:
                radial-gradient(circle at 10% 10%, rgba(255, 183, 103, 0.28), transparent 22%),
                radial-gradient(circle at 90% 8%, rgba(255, 122, 163, 0.2), transparent 24%),
                radial-gradient(circle at 50% 100%, rgba(104, 208, 255, 0.16), transparent 26%),
                linear-gradient(180deg, #f9f4ff 0%, #fdfaf5 100%);
        }

        .container {
            width: min(100%, 440px);
            padding: 38px 34px 32px;
            border: 1px solid rgba(109, 94, 246, 0.1);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 18px 40px rgba(109, 94, 246, 0.12);
            animation: aparecer 0.5s ease;
        }

        .marca {
            margin: 0 0 8px;
            color: var(--cor-primaria-escura);
            font-size: 2rem;
            text-align: center;
        }

        .ilustracao-dinossauro {
            display: block;
            width: min(100%, 250px);
            height: auto;
            margin: -18px auto 8px;
        }

        .descricao {
            margin: 0 0 28px;
            color: #5d6072;
            line-height: 1.6;
            text-align: center;
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            display: grid;
            gap: 8px;
            color: var(--cor-texto);
            font-weight: 800;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dfe3f0;
            border-radius: 12px;
            color: var(--cor-texto);
            background: #fff;
            font: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--cor-primaria);
            box-shadow: 0 0 0 4px rgba(109, 94, 246, 0.12);
        }

        button {
            margin-top: 4px;
            padding: 14px 16px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg, var(--cor-primaria), var(--cor-primaria-escura));
            box-shadow: 0 12px 24px rgba(109, 94, 246, 0.2);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .status {
            min-height: 24px;
            margin-top: 2px;
            font-weight: 700;
            text-align: center;
        }

        .sucesso { color: var(--cor-verde); }
        .erro { color: var(--cor-erro); }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container { padding: 30px 22px 26px; }
            .marca { font-size: 1.75rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="ilustracao-dinossauro" src="/static/dinossauro.svg" alt="Dinossauro verde lendo um livro">
        <h1 class="marca">📚 Biblioteca Infantil</h1>
        <p class="descricao">Entre para acessar e administrar os livros da biblioteca.</p>

        <form id="loginForm">
            <label>
                Usuário
                <input type="text" id="username" name="username" placeholder="admin" required>
            </label>
            <label>
                Senha
                <input type="password" id="password" name="password" placeholder="123" required>
            </label>
            <button type="submit">Entrar</button>
            <div class="status" id="status"></div>
        </form>
    </div>

    <!-- Script de validação local e tratamento de erro -->
    <script> 
        const loginForm = document.getElementById('loginForm'); 
        const statusDiv = document.getElementById('status'); 

        loginForm.addEventListener('submit', async function(event) { 
            event.preventDefault();
 
            statusDiv.textContent = '';

            try {
                const resposta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.erro || 'Usuário ou senha incorretos.');
                }

                statusDiv.textContent = 'Login efetuado com sucesso!';
                statusDiv.className = 'status sucesso';

                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } catch (erro) {
                statusDiv.textContent = erro.message;
                statusDiv.className = 'status erro';
            }
        });
    </script>


</body>
</html>
