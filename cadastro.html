<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Criar conta - Cantinho da Leitura</title>

    <style>
      :root {
        --cor-primaria: #6d5ef6;
        --cor-primaria-escura: #4d3fd9;
        --cor-texto: #2b2a3d;
        --cor-verde: #22b181;
        --cor-erro: #c03952;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;

        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--cor-texto);

        background: radial-gradient(
            circle at 10% 10%,
            rgba(255, 183, 103, 0.28),
            transparent 22%
          ),
          radial-gradient(
            circle at 90% 8%,
            rgba(255, 122, 163, 0.2),
            transparent 24%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(104, 208, 255, 0.16),
            transparent 26%
          ),
          linear-gradient(180deg, #f9f4ff 0%, #fdfaf5 100%);
      }

      .container {
        width: min(100%, 440px);

        padding: 38px 34px 32px;

        border: 1px solid rgba(109, 94, 246, 0.1);
        border-radius: 30px;

        background: rgba(255, 255, 255, 0.94);

        box-shadow: 0 18px 40px rgba(109, 94, 246, 0.12);
      }

      .ilustracao-dinossauro {
        display: block;

        width: min(100%, 230px);

        margin: -18px auto 8px;
      }

      h1 {
        margin: 0 0 8px;

        color: var(--cor-primaria-escura);

        text-align: center;
      }

      .descricao {
        margin-bottom: 26px;

        color: #5d6072;

        line-height: 1.5;

        text-align: center;
      }

      form {
        display: grid;

        gap: 18px;
      }

      label {
        display: grid;

        gap: 8px;

        font-weight: 800;
      }

      input {
        width: 100%;

        padding: 13px 14px;

        border: 1px solid #dfe3f0;
        border-radius: 12px;

        font: inherit;
      }

      input:focus {
        outline: none;

        border-color: var(--cor-primaria);

        box-shadow: 0 0 0 4px rgba(109, 94, 246, 0.12);
      }

      button {
        padding: 14px;

        border: 0;
        border-radius: 12px;

        color: white;

        background: linear-gradient(
          135deg,
          var(--cor-primaria),
          var(--cor-primaria-escura)
        );

        font: inherit;
        font-weight: 800;

        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      .status {
        min-height: 24px;

        text-align: center;

        font-weight: 700;
      }

      .sucesso {
        color: var(--cor-verde);
      }

      .erro {
        color: var(--cor-erro);
      }

      .login {
        margin-top: 18px;

        text-align: center;

        color: #5d6072;
      }

      .login a {
        color: var(--cor-primaria-escura);

        font-weight: 800;

        text-decoration: none;
      }

      .login a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img
        class="ilustracao-dinossauro"
        src="/static/dinossauro.svg"
        alt="Dinossauro lendo um livro"
      />

      <h1>📚 Criar conta</h1>

      <p class="descricao">Cadastre-se para acessar o Cantinho da Leitura.</p>

      <form id="cadastroForm">
        <label>
          Usuário

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Escolha um usuário"
            minlength="3"
            required
          />
        </label>

        <label>
          Senha

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Crie uma senha"
            minlength="6"
            required
          />
        </label>

        <label>
          Confirmar senha

          <input
            type="password"
            id="confirmPassword"
            placeholder="Digite a senha novamente"
            minlength="6"
            required
          />
        </label>

        <button type="submit">Criar conta</button>

        <div class="status" id="status"></div>
      </form>

      <div class="login">
        Já possui uma conta?

        <a href="/login"> Entrar </a>
      </div>
    </div>

    <script>
      const cadastroForm = document.getElementById("cadastroForm");

      const statusDiv = document.getElementById("status");

      cadastroForm.addEventListener(
        "submit",

        async function (event) {
          event.preventDefault();

          statusDiv.textContent = "";

          const username = document.getElementById("username").value.trim();

          const password = document.getElementById("password").value;

          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (password !== confirmPassword) {
            statusDiv.textContent = "As senhas não coincidem.";

            statusDiv.className = "status erro";

            return;
          }

          try {
            const resposta = await fetch("/api/cadastro", {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                username: username,

                password: password,
              }),
            });

            const dados = await resposta.json();

            if (!resposta.ok) {
              throw new Error(dados.erro || "Não foi possível criar a conta.");
            }

            statusDiv.textContent = "Conta criada com sucesso!";

            statusDiv.className = "status sucesso";

            setTimeout(() => {
              window.location.href = "/login";
            }, 1200);
          } catch (erro) {
            statusDiv.textContent = erro.message;

            statusDiv.className = "status erro";
          }
        }
      );
    </script>
  </body>
</html>
